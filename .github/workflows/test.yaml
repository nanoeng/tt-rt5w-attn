# RTL test of the controller + behavioural analog model (cocotb, Icarus), as in the Tiny Tapeout templates.
name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Run RTL tests
        run: |
          cd test
          make clean || true
          make
          # cocotb writes results.xml; fail the job if any test failed
          ! grep -q failure results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/results.xml
            test/*.vcd
