# Tiny Tapeout CI (from TinyTapeout/ttsky-analog-template, action tag ttsky26e): package the hard macro, run the
# official precheck on GitHub's runner (KLayout/magic versions of the shuttle) and publish the 3D viewer.
name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read top module name
        id: top_module
        run: |
          echo TOP_MODULE=`yq '.project.top_module' info.yaml` | tee $GITHUB_OUTPUT

      - name: Create and publish the GDS artifact
        uses: TinyTapeout/tt-gds-action/custom_gds@ttsky26e
        with:
          top_module: ${{ steps.top_module.outputs.TOP_MODULE }}
          gds_path: gds/${{ steps.top_module.outputs.TOP_MODULE }}.gds
          lef_path: lef/${{ steps.top_module.outputs.TOP_MODULE }}.lef
          verilog_path: src/project.v
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26e

      # The reports artifact is also uploaded by the action; print the magic DRC summary into the log as well,
      # so a failure can be read without downloading the artifact.
      - name: Magic DRC summary
        if: always()
        run: |
          f=tt/precheck/reports/magic_drc.txt
          if [ -f "$f" ]; then
            echo "== error types (count of coordinate lines per description) =="
            awk '/^-+$/{next} /^[ ]*-?[0-9]/{c[d]++; if(!(d in x)){x[d]=$0}; next} {d=$0} END{for(k in c) printf "%6d  %s   first: %s\n", c[k], k, x[k]}' "$f" | sort -rn
            echo "== first 150 lines =="
            head -n 40 "$f"
          else
            ls -R tt/precheck/reports || true
          fi

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26e
